timeout: 5

# ITEM-399: the medium carries two kernels, and the entries below boot the
# installer one.  boot():/boot/hfoc-kernel.elf is the *product appliance*
# kernel - the bytes the install stages into the installed ESP and the kernel
# the installed disk runs - and it is a module here, never an entry.
/HFOC install (unattended, media-authorised)
    protocol: limine
    cmdline: hfoc.install=unattended
    path: boot():/boot/hfoc-installer-kernel.elf
    module_path: boot():/boot/hfoc-kernel.elf
    # HFOC_HOST_SEED_MODULE
    # HFOC_SSH_KEY_MODULE
    module_path: boot():/boot/hfoc-install.token
    module_path: boot():/boot/hfoc-installed.conf
    module_path: boot():/boot/hfoc-installed.chain
    module_path: boot():/boot/hfoc-rootfs.arc
    module_path: boot():/boot/hfoc-install.payload
    module_path: boot():/boot/hfoc-install.man
    module_path: boot():/EFI/BOOT/BOOTX64.EFI

/HFOC install (console confirmation)
    protocol: limine
    cmdline: hfoc.install=console
    path: boot():/boot/hfoc-installer-kernel.elf
    module_path: boot():/boot/hfoc-kernel.elf
    # HFOC_HOST_SEED_MODULE
    # HFOC_SSH_KEY_MODULE
    module_path: boot():/boot/hfoc-install.token
    module_path: boot():/boot/hfoc-installed.conf
    module_path: boot():/boot/hfoc-installed.chain
    module_path: boot():/boot/hfoc-rootfs.arc
    module_path: boot():/boot/hfoc-install.payload
    module_path: boot():/boot/hfoc-install.man
    module_path: boot():/EFI/BOOT/BOOTX64.EFI

/HFOC appliance (no install)
    protocol: limine
    cmdline: hfoc.install=none
    path: boot():/boot/hfoc-installer-kernel.elf
    module_path: boot():/boot/hfoc-rootfs.arc
