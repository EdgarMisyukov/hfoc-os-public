timeout: 3

# ITEM-466 (round 5): the console no longer asks for a fixed resolution.  ITEM-463
# put `resolution: 1280x720` at the top of the file, where Limine ignores it;
# ITEM-464 moved `resolution: 1024x768` onto the menu entry, which forced the
# guest down to 1024x768 - but a text console gains nothing from a mode the
# monitor then stretches, and a real 4K panel got 3840x2160 anyway because the
# installed configuration carried no line at all.  The mode is now the monitor's
# own preferred one: Limine boots the firmware preference, and the kernel's
# `[FB]` record names `preferred=`, the `available=` list, what the rule would
# choose if the preference had been refused, and the automatic font scale.
/HFOC OS 1.0.0
    protocol: limine
    path: boot():/boot/hfoc-kernel.elf
