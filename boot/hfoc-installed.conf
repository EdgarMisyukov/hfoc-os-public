timeout: 3

# ITEM-397: the boot configuration of the *installed* system.
#
# The installer stages this file into the installed ESP as
# \boot\limine\limine.conf, so its paths are resolved against that ESP: the
# kernel it names is the kernel the installer staged next to it, and the two
# module paths are the sealed boot-chain manifest and this configuration
# itself, which is what makes the installed system's own boot chain verifiable
# (`[BOOT-CHAIN] verdict=ATTESTED`).  Limine matches a name that does not fit
# the 8.3 short form case sensitively, so the names here are byte-for-byte the
# names the ESP carries.
#
# ITEM-466 (round 5): the installed entry no longer asks for a fixed mode.
# ITEM-464 wrote `resolution: 1024x768` here, following ITEM-463's root-cause
# note, but the owner's rule is "the mode is the monitor's native/preferred one,
# with a reasonable fallback to the largest available".  The `[FB]` record the
# kernel writes names `preferred=`, the `available=` list, the mode the rule
# would choose if the preference had been refused, the actual mode and the
# automatic font scale, so the installed appliance boots at the panel's own
# resolution instead of a small mode the monitor then stretches.
/HFOC OS 1.0.0
    protocol: limine
    path: boot():/boot/hfoc-kernel.elf
    module_path: boot():/boot/hfoc-boot.man
    module_path: boot():/boot/limine/limine.conf
    module_path: boot():/boot/hfoc-rootfs.arc
